name: Aplicar otimização do separador
on:
  push:
    branches: [aplicar-padrao-estudio]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Instalar o separador otimizado
        env:
          GH_TOKEN: ${{ secrets.FAIXALAB_CODESPACES_TOKEN }}
          GH_PROMPT_DISABLED: '1'
          FAIXALAB_CODESPACE: expert-space-funicular-gjxr569wq4939wg9
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/update-separator.py" <<'PY'
          from pathlib import Path
          import subprocess
          
          root = Path('/workspaces/mvlab')
          source = root / '.faixalab/source-b02a77486eda28341da84d948c5f4a0cec22dcc6'
          subprocess.run(['git', '-C', str(root), 'diff', '--quiet'], check=True)
          subprocess.run(['git', '-C', str(source), 'diff', '--quiet'], check=True)
          subprocess.run(['git', '-C', str(source), 'fetch', '-q', '--depth=1',
                          'https://github.com/Marcelo-Preigschadt/FaixaLab.git', '0a74a79401b1e784f8908d9513cf7ba2ae13452a'], check=True)
          changed = subprocess.check_output(['git', '-C', str(source), 'diff', '--name-only', 'HEAD', 'FETCH_HEAD'], text=True).splitlines()
          allowed = {'app/faixalab/separator_runner.py', 'app/faixalab/pipeline.py'}
          if not set(changed) <= allowed:
              raise SystemExit('O checkout contém outras alterações além do separador.')
          subprocess.run(['git', '-C', str(source), 'checkout', '-q', '--detach', '0a74a79401b1e784f8908d9513cf7ba2ae13452a'], check=True)
          subprocess.run(['git', '-C', str(root), 'fetch', '-q', '--depth=100', 'origin', 'main'], check=True)
          subprocess.run(['git', '-C', str(root), 'merge', '--ff-only', 'FETCH_HEAD'], check=True)
          print('Separador atualizado para as próximas execuções: 0a74a79401b1e784f8908d9513cf7ba2ae13452a')
          print('Perfil CPU: duas passagens, instrumentos e voz refinada.')
          PY
          timeout 100s gh codespace ssh -c "$FAIXALAB_CODESPACE" -- -T python3 - < "$RUNNER_TEMP/update-separator.py"
