name: Verificar recursos do separador
on:
  push:
    branches: [aplicar-padrao-estudio]
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar a execução atual
        env:
          GH_TOKEN: ${{ secrets.FAIXALAB_CODESPACES_TOKEN }}
          GH_PROMPT_DISABLED: '1'
          FAIXALAB_CODESPACE: expert-space-funicular-gjxr569wq4939wg9
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recursos.py" <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          
          def read(path):
              try:
                  return Path(path).read_text().strip()
              except OSError:
                  return None
          
          limits = {'cpu_count': os.cpu_count(), 'affinity': len(os.sched_getaffinity(0)),
                    'cpu_max': read('/sys/fs/cgroup/cpu.max'),
                    'cpu_stats': read('/sys/fs/cgroup/cpu.stat'),
                    'memory_current': read('/sys/fs/cgroup/memory.current'),
                    'memory_max': read('/sys/fs/cgroup/memory.max'),
                    'memory_pressure': read('/proc/pressure/memory'),
                    'nvidia_devices': [str(p) for p in Path('/dev').glob('nvidia[0-9]*')]}
          print('RECURSOS', json.dumps(limits))
          for item in Path('/workspaces/.faixalab-data/projects').glob('*/project.json'):
              value = json.loads(item.read_text())
              if value.get('status') in ('queued', 'processing'):
                  print('PROCESSAMENTO', json.dumps({key: value.get(key) for key in
                        ('status', 'stage', 'progress', 'duration', 'elapsed_seconds', 'worker_runtime', 'options')}))
          workers = []
          for process in Path('/proc').iterdir():
              if not process.name.isdigit():
                  continue
              try:
                  args = (process / 'cmdline').read_bytes().split(bytes([0]))
                  if b'faixalab.separator_runner' not in args:
                      continue
                  env = dict(os.fsdecode(part).split('=', 1) for part in
                             (process / 'environ').read_bytes().split(bytes([0])) if b'=' in part)
                  status = (process / 'status').read_text().splitlines()
                  ticks = (process / 'stat').read_text().rsplit(')', 1)[1].split()
                  workers.append((process, int(ticks[11]) + int(ticks[12])))
                  print('WORKER', json.dumps({'pid': process.name,
                        'runtime': [line for line in status if line.startswith(('VmRSS:', 'VmSwap:', 'Threads:'))],
                        'threads': {key: env.get(key) for key in
                                    ('FAIXALAB_CPU_THREADS', 'OMP_NUM_THREADS', 'MKL_NUM_THREADS', 'OPENBLAS_NUM_THREADS')}}))
              except OSError:
                  continue
          started = time.monotonic()
          time.sleep(2)
          for process, before in workers:
              try:
                  ticks = (process / 'stat').read_text().rsplit(')', 1)[1].split()
                  used = (int(ticks[11]) + int(ticks[12]) - before) / os.sysconf('SC_CLK_TCK')
                  print('CPU_WORKER', round(100 * used / (time.monotonic() - started), 1))
              except OSError:
                  pass
          PY
          timeout 90s gh codespace ssh -c "$FAIXALAB_CODESPACE" -- -T python3 - < "$RUNNER_TEMP/recursos.py"
